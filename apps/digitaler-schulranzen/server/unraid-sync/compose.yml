services:
  schulranzen-sync:
    build: .
    container_name: schulranzen-sync
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - DATA_DIR=/data
      - MAX_VERSIONS=20
      - MAX_UPLOAD_MB=1024
    volumes:
      - /mnt/user/appdata/digitaler-schulranzen-sync/data:/data
