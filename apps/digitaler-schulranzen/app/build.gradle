plugins { id 'com.android.application' }

android {
    namespace 'de.millione.schulranzen'
    compileSdk 35

    defaultConfig {
        applicationId 'de.millione.schulranzen'
        minSdk 26
        targetSdk 35
        versionCode 1507
        versionName '15.0.7'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


// Kotlin 1.8.x already contains the former JDK7/JDK8 stdlib extensions.
// Some transitive Android libraries still request older split artifacts
// (kotlin-stdlib-jdk7 / kotlin-stdlib-jdk8), which causes duplicate classes.
// Keep one coherent Kotlin runtime and remove the legacy split jars globally.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name == 'kotlin-stdlib') {
            details.useVersion '1.8.10'
            details.because 'Use one Kotlin stdlib version and avoid duplicate Kotlin runtime classes'
        }
    }
}


dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.10')
    implementation 'androidx.input:input-motionprediction:1.0.0'
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
