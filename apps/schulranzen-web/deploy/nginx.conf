server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        image/png png;
        image/svg+xml svg;
        font/woff2 woff2;
    }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Browsers must learn of a new version right away; the service worker caches the rest itself.
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always; }

    # Local content packs are never served, even if a folder is copied by mistake.
    location /inhalt/ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
