name: Native tests and Android APK
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native slicer tests
        run: |
          cmake -S native-tests -B native-tests/build
          cmake --build native-tests/build --parallel
          ctest --test-dir native-tests/build --output-on-failure
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build APK
        run: gradle :apps:layerforge:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: layerforge-alpha-debug-apk
          path: apps/layerforge/build/outputs/apk/debug/*.apk
