name: Native tests and Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native slicer tests
        run: |
          cmake -S native-tests -B native-tests/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native-tests/build --parallel
          ctest --test-dir native-tests/build --output-on-failure

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # GitHub ubuntu-latest already includes ANDROID_HOME and sdkmanager.
      # Do not call android-actions/setup-android@v3: it attempts to install
      # the obsolete Android SDK package "tools" and fails on modern runners.
      - name: Install Android SDK 35 and NDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -n "${ANDROID_HOME:-}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build installable Android debug APK
        run: gradle :apps:layerforge:assembleDebug --no-daemon --stacktrace
      - name: Verify debug APK exists
        run: |
          ls -lah apps/layerforge/build/outputs/apk/debug/
          test -s apps/layerforge/build/outputs/apk/debug/layerforge-debug.apk
      - name: Publish installable APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: layerforge-android-debug-apk
          path: apps/layerforge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
