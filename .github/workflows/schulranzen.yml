name: Schulranzen (neu) APK

on:
  push:
    branches: [main]
    paths: ['apps/schulranzen/**', '.github/workflows/schulranzen.yml']
  pull_request:
    paths: ['apps/schulranzen/**', '.github/workflows/schulranzen.yml']
  workflow_dispatch:

permissions:
  contents: read

# Needs no secrets. Without signing/ the APKs are signed with a throwaway debug
# key: they prove the build, but cannot update an installed app (docs/UPDATE.md).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/schulranzen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests
        run: gradle :core:test :app:testDebugUnitTest --no-daemon
      - name: Android Lint (Pflicht, Bestand in app/lint-baseline.xml)
        run: gradle :app:lintRelease --no-daemon
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Release APKs (R8)
        run: gradle :app:assembleRelease --no-daemon
      - name: release.sh ist syntaktisch in Ordnung
        run: bash -n tools/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: schulranzen-debug-apk
          path: apps/schulranzen/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schulranzen-lint-report
          path: apps/schulranzen/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
