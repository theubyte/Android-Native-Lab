name: Import Digitaler Schulranzen snapshot

on:
  push:
    branches:
      - digitaler-schulranzen-import
    paths:
      - .github/workflows/import-digitaler-schulranzen.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: digitaler-schulranzen-import
          fetch-depth: 0

      - name: Reconstruct source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/digitaler-schulranzen/archive.b64.part01
          mkdir -p /tmp/dsr-import
          cat .import/digitaler-schulranzen/archive.b64.part* | base64 --decode > /tmp/dsr-import/source.tar.gz
          rm -rf apps/digitaler-schulranzen
          mkdir -p apps/digitaler-schulranzen
          tar -xzf /tmp/dsr-import/source.tar.gz -C apps/digitaler-schulranzen
          rm -rf .import/digitaler-schulranzen

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/digitaler-schulranzen .import/digitaler-schulranzen
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Digitaler Schulranzen V15.0.7 source and project context"
          git push origin HEAD:digitaler-schulranzen-import
